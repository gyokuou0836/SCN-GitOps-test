name: deploy
# GitHub Actions から CDK アプリケーションを作成・更新するためのワークフロー。
# GitHub OIDC を利用して AWS の IAM ロールを引き受け、S3 バケットを構築する。

on:
  push:
    branches: [deploy_dev, deploy_stg]
    paths:
      - "bin/**"
      - "lib/**"
      - "cdk.json"
      - "package*.json"
      - "tsconfig.json"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [deploy_dev, deploy_stg, main]
    paths:
      - "bin/**"
      - "lib/**"
      - "cdk.json"
      - "package*.json"
      - "tsconfig.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging]
        default: dev

# OIDC トークンの発行はデプロイジョブのみに限定する。
permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1
  # デプロイ先アカウント。CDK CLI の自動解決に依存せず明示的に指定する。
  AWS_ACCOUNT_ID: "646977526034"
  # PR の synth でもアカウントを解決できるようにする（context 未指定時のフォールバック）。
  CDK_DEFAULT_ACCOUNT: "646977526034"

# 同一環境への同時デプロイを防ぐ。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check CDK app
        run: npm run build

      - name: Synthesize CDK app
        run: npx cdk synth --context env=dev --context account="${AWS_ACCOUNT_ID}" --context bucketName=scn-gitops-wangyu-dev-646977526034

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (github.ref_name == 'deploy_stg' && 'staging') || 'dev' }}
    permissions:
      id-token: write
      contents: read
    env:
      TARGET_ENV: ${{ inputs.environment || (github.ref_name == 'deploy_stg' && 'staging') || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deployment dependencies
        run: npm ci

      - name: Show Expected OIDC Subject
        env:
          OWNER_ID: ${{ github.repository_owner_id }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "=== 信頼ポリシーに必要な sub (immutable subject) ==="
          if [ -n "$OWNER_ID" ] && [ -n "$REPO_ID" ]; then
            echo "  repo:${OWNER}@${OWNER_ID}/${REPO}@${REPO_ID}:environment:${TARGET_ENV}"
          else
            echo "  repo:<owner>@<owner-id>/<repo>@<repo-id>:environment:${TARGET_ENV}"
          fi
          echo "  ※ この値とロールの信頼ポリシー sub を一致させること"

      # トークン内容の出力はデバッグ有効時のみ実行する。
      - name: Debug OIDC Token Claims
        if: runner.debug == '1'
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          if [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]; then
            echo "=== OIDC Token Header & Payload (signature omitted) ==="
            python3 -c "
          import sys, json, base64
          t = sys.argv[1]
          parts = t.split('.')
          def pad(b): return b + '=' * (-len(b) % 4)
          header = json.loads(base64.urlsafe_b64decode(pad(parts[0])))
          payload = json.loads(base64.urlsafe_b64decode(pad(parts[1])))
          print('Header:', json.dumps(header))
          for k in ['iss', 'aud', 'sub', 'repository', 'environment', 'ref', 'actor']:
              print(f'  {k}: {payload.get(k)}')
          " "$TOKEN"
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Verify AWS account
        run: |
          ACTUAL=$(aws sts get-caller-identity --query Account --output text)
          if [ "$ACTUAL" != "${AWS_ACCOUNT_ID}" ]; then
            echo "::error::AssumeRole 先のアカウントが想定と異なります (expected=${AWS_ACCOUNT_ID}, actual=${ACTUAL})"
            exit 1
          fi

      - name: Check required variables
        run: |
          if [ -z "${{ vars.BUCKET_NAME }}" ]; then
            echo "::error::Environment 変数 BUCKET_NAME が未設定です（例: scn-gitops-wangyu-dev-646977526034）"
            exit 1
          fi

      - name: Deploy stack
        run: |
          npx cdk deploy --require-approval never \
            --stack-name "scn-gitops-wangyu-${TARGET_ENV}" \
            --context env="${TARGET_ENV}" \
            --context account="${AWS_ACCOUNT_ID}" \
            --context bucketName="${{ vars.BUCKET_NAME }}"
